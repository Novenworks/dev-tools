name: DevRepo CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate DevRepo (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run DevRepo tests
        shell: ${{ matrix.shell }}
        run: ./tests/Test-DevTools.ps1
