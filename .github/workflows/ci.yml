name: DevRepo CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate DevRepo (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run DevRepo tests in PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./tests/Test-DevTools.ps1

      - name: Run DevRepo tests in Windows PowerShell 5.1
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./tests/Test-DevTools.ps1
